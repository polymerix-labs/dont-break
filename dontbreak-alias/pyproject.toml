[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dontbreak"
# Rewritten to the release tag by CI (publish:pypi-alias) right before build —
# see .gitlab-ci.yml. Never hand-edit; a stale version here just means CI
# forgot to stamp it, not that this is the real version.
version = "0.0.0"
description = "Alias for dont-break — see https://pypi.org/project/dont-break/"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Polymerix", email = "hello@dont-break.com" }]
dependencies = ["dont-break"]

[project.urls]
Homepage = "https://dont-break.com"
Source = "https://github.com/polymerix-labs/dont-break"

[tool.hatch.build.targets.wheel]
packages = ["dontbreak"]
